<svg xmlns="http://www.w3.org/2000/svg" width="1190.55" height="841.89" viewBox="0 0 1190.55 841.89"><rect width="100%" height="100%" fill="white"/><path d="M20,821.89 L1170.55,821.89" stroke="#223943" stroke-width="0.6" fill="none"/><path d="M1170.55,821.89 L1170.55,20.0" stroke="#223943" stroke-width="0.6" fill="none"/><path d="M1170.55,20.0 L20,20.0" stroke="#223943" stroke-width="0.6" fill="none"/><path d="M20,20.0 L20,821.89" stroke="#223943" stroke-width="0.6" fill="none"/><text x="40" y="46.889999999999986" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#182b35">图册说明、木板尺寸与打印清单</text><text x="40" y="72.88999999999999" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">R1 试制工程图 | 单位 mm | 第三角投影 | 按标注及坐标建模，禁止按图片比例量取</text><path d="M20,91.88999999999999 L1170.55,91.88999999999999" stroke="#223943" stroke-width="0.6" fill="none"/><path d="M20,759.89 L1170.55,759.89" stroke="#223943" stroke-width="0.6" fill="none"/><text x="38" y="781.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">载带检测支架 / 木板＋小打印件</text><text x="38" y="803.89" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#182b35">设计：AI参数化生成；审核/试装：待完成；日期：2026-09-09</text><text x="625" y="781.89" font-family="Microsoft YaHei,sans-serif" font-size="11" fill="#975127">状态：试制，未发布量产；无实物承重、光学或整机干涉验收</text><text x="965" y="803.89" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#182b35">图册 1/10</text><text x="40" y="124.88999999999999" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">本图册含8种实体零件，分别给正视、俯视、右视、孔槽坐标和STEP；不再使用旧的仅外形占位图。</text><text x="40" y="151.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">重要边界：这是按用户允许的假设形成的试制图，不是已通过实物验证的工业生产发布图。</text><text x="40" y="178.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">已知：板/亚克力130×90；机身420×110×80；灯90/40/22；镜头外径14、高18.3。</text><text x="40" y="205.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">假设：亚克力厚1、镜头偏心20、工作距离默认100；主体仍需实拍与试装后调整。</text><text x="40" y="232.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">材料：打印件PETG，先打印小试件；木板统一12厚胶合板。打印尺寸能力按至少200×200×200准备。</text><text x="40" y="259.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">建议试制验收：打印件一般外形±0.3、孔中心±0.2，配合孔槽先试片；这是目标，不是打印设备精度保证。</text><text x="40" y="286.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">全部直径4.5为M4间隙孔；打印后按试片检查/清孔。槽标总长，圆头R2.25；去毛刺锐边，不擅改接触面。</text><text x="40" y="313.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">每页三视共用比例；模型局部原点见坐标说明；孔轴方向以X/Y/Z明确标出。虚线为隐藏轮廓。</text><text x="40" y="340.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">托臂中心保持X=±65。P02宽64，板中心-20时，右承托名义重叠12，左52；固定前仍须检查实物接触。</text><text x="40" y="399.89" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#182b35">木板大致下料尺寸（孔位试装后再钻）</text><text x="45" y="430.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">W01</text><text x="125" y="430.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">底板</text><text x="285" y="430.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">650×350×12</text><text x="560" y="430.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">1</text><text x="45" y="460.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">W02</text><text x="125" y="460.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">立板</text><text x="285" y="460.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">300×360×12</text><text x="560" y="460.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">1</text><text x="45" y="490.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">W03</text><text x="125" y="490.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">三角加强板</text><text x="285" y="490.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">直角边120×200，厚12</text><text x="560" y="490.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">2</text><text x="45" y="520.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">W04</text><text x="125" y="520.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">进/出料托板</text><text x="285" y="520.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">100×100×12</text><text x="560" y="520.89" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#182b35">2</text><text x="40" y="566.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">托料脚不预切：按实际带面、载带下凸高度及12厚托板反算；底板+立板木结构高约372。</text><text x="40" y="599.89" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#182b35">打印数量</text><text x="45" y="630.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P01  对称托臂  ×2   /   24×195×50</text><text x="45" y="657.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P02  加宽承托块  ×4   /   64×40×10</text><text x="45" y="684.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P03  亚克力限位压片  ×4   /   64×40×8</text><text x="45" y="711.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P04  灯架竖向导板  ×2   /   24×12×180</text><text x="605" y="630.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P05  灯架前后托臂  ×2   /   20×150×44</text><text x="605" y="657.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P06A  灯外夹圈后半  ×1   /   136×54×16</text><text x="605" y="684.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P06B  灯外夹圈前半  ×1   /   136×54×16</text><text x="605" y="711.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P07  灯圈外侧连接片  ×4   /   68×16×8</text></svg>