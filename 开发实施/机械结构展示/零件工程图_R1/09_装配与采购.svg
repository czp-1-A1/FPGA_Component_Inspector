<svg xmlns="http://www.w3.org/2000/svg" width="1190.55" height="841.89" viewBox="0 0 1190.55 841.89"><rect width="100%" height="100%" fill="white"/><path d="M20,821.89 L1170.55,821.89" stroke="#223943" stroke-width="0.6" fill="none"/><path d="M1170.55,821.89 L1170.55,20.0" stroke="#223943" stroke-width="0.6" fill="none"/><path d="M1170.55,20.0 L20,20.0" stroke="#223943" stroke-width="0.6" fill="none"/><path d="M20,20.0 L20,821.89" stroke="#223943" stroke-width="0.6" fill="none"/><text x="40" y="46.889999999999986" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#182b35">试装顺序、紧固件与未完成验证</text><text x="40" y="72.88999999999999" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">R1 试制工程图 | 单位 mm | 第三角投影 | 按标注及坐标建模，禁止按图片比例量取</text><path d="M20,91.88999999999999 L1170.55,91.88999999999999" stroke="#223943" stroke-width="0.6" fill="none"/><path d="M20,759.89 L1170.55,759.89" stroke="#223943" stroke-width="0.6" fill="none"/><text x="38" y="781.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">载带检测支架 / 木板＋小打印件</text><text x="38" y="803.89" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#182b35">设计：AI参数化生成；审核/试装：待完成；日期：2026-09-09</text><text x="625" y="781.89" font-family="Microsoft YaHei,sans-serif" font-size="11" fill="#975127">状态：试制，未发布量产；无实物承重、光学或整机干涉验收</text><text x="965" y="803.89" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#182b35">图册 10/10</text><text x="40" y="128.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">1. 木板先按大外形下料；托臂仍左右对称。先摆实物、对光轴，再钻安装孔。</text><text x="40" y="157.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">2. P01两件；P02/P03各四件。板接触区朝内，固定螺栓放到亚克力板外侧，禁止挤压PCB。</text><text x="40" y="186.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">3. P02局部Y=0..14接触板；前后两组相向摆放。与P01两个长槽相配，默认留约±10前后微调。</text><text x="40" y="215.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">4. P04安装X=±100，不与相机托臂根部重叠。P05根部各用两根螺栓穿P04长槽锁紧。</text><text x="40" y="244.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">5. P06A/B从灯外壳侧面夹持，初始分缝2；薄软垫试配，不能夹LED、线口或镜头。</text><text x="40" y="273.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">6. P07四件连接灯圈的X=±48安装孔与X=±100灯托臂；名义中心距52，均位于灯背面。</text><text x="40" y="302.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">7. 灯圈夹紧、防滑确认后再装P07；确认线口是否需避让。夹不牢时停用此夹圈，不能强拧损伤灯壳。</text><text x="40" y="331.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">8. 本图册验证了8件实体有效性、单实体、包络尺寸；没有完成整机各调节位置的干涉或强度验证。</text><text x="40" y="360.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">9. 40—200只是目标工作距离范围，灯厚22会限制近距离布局；先试拍，再限定有效调节行程。</text><text x="40" y="389.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">10. 载带导向件待样带轮廓确定。本图册覆盖相机承托与灯架，不把未知载带导向图伪装成定稿。</text><text x="40" y="451.89" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#182b35">M4紧固件建议备料（不含木角码与设备固定）</text><text x="45" y="483.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P01根部/木板</text><text x="285" y="483.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">4套 M4×30</text><text x="515" y="483.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">根部10＋木板12＋垫片/螺母</text><text x="45" y="511.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P01+P02+P03</text><text x="285" y="511.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">8套 M4×40</text><text x="515" y="511.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">10＋10＋8＋垫片/螺母；核实露出</text><text x="45" y="539.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P04/木板</text><text x="285" y="539.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">4套 M4×35</text><text x="515" y="539.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">导板12＋木板12＋垫片/螺母</text><text x="45" y="567.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P05/P04</text><text x="285" y="567.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">4套 M4×35</text><text x="515" y="567.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">根部12＋导板12＋垫片/螺母</text><text x="45" y="595.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P06两半夹紧</text><text x="285" y="595.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">2套 M4×35</text><text x="515" y="595.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">两夹耳12＋12＋分缝2＋垫片/螺母</text><text x="45" y="623.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P07/P06</text><text x="285" y="623.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">4套 M4×35</text><text x="515" y="623.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">连接片8＋灯圈16＋垫片/螺母</text><text x="45" y="651.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">P07/P05</text><text x="285" y="651.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">4套 M4×30</text><text x="515" y="651.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">连接片8＋托臂12＋垫片/螺母</text><text x="40" y="698.89" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#182b35">共30套：M4×30 8根、×35 14根、×40 8根；M4螺母30、大垫片60，备料可加约20%。</text><text x="40" y="722.89" font-family="Microsoft YaHei,sans-serif" font-size="11" fill="#182b35">默认螺母；可在调节处换手拧件，但其实际厚度会改变所需螺栓长度。先核对再整批采购。</text></svg>